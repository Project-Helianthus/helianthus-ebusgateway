name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  terminology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if git grep -nIwiE 'm[a]ster|s[l]ave'; then
            echo "Found legacy terminology."
            exit 1
          fi
      - run: python3 scripts/source_selection_m4_gate.py

  build:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/Project-Helianthus/*
      GONOSUMDB: github.com/Project-Helianthus/*
      GOPROXY: direct
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          TOKEN="${{ secrets.REPO_READ_TOKEN }}"
          if [ -z "$TOKEN" ]; then TOKEN="${{ github.token }}"; fi
          echo "machine github.com login x-access-token password ${TOKEN}" > ~/.netrc
          chmod 600 ~/.netrc
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: ./scripts/check_portal_assets.sh
      - run: go vet ./...
      - run: go build ./...
      - name: Compile Linux 32-bit sync evidence
        run: |
          GOOS=linux GOARCH=386 go test -c -o /dev/null ./internal/syncevidence
          GOOS=linux GOARCH=arm GOARM=7 go test -c -o /dev/null ./internal/syncevidence

  test:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/Project-Helianthus/*
      GONOSUMDB: github.com/Project-Helianthus/*
      GOPROXY: direct
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          TOKEN="${{ secrets.REPO_READ_TOKEN }}"
          if [ -z "$TOKEN" ]; then TOKEN="${{ github.token }}"; fi
          echo "machine github.com login x-access-token password ${TOKEN}" > ~/.netrc
          chmod 600 ~/.netrc
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: go test -race -count=1 ./...
      - run: python3 scripts/passive_canary_verifier_test.py
      - run: python3 scripts/source_selection_m4_gate_test.py
      - run: python3 scripts/transport_gate_test.py
      - run: python3 scripts/passive_smoke_gate_test.py

  lint:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/Project-Helianthus/*
      GONOSUMDB: github.com/Project-Helianthus/*
      GOPROXY: direct
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          TOKEN="${{ secrets.REPO_READ_TOKEN }}"
          if [ -z "$TOKEN" ]; then TOKEN="${{ github.token }}"; fi
          echo "machine github.com login x-access-token password ${TOKEN}" > ~/.netrc
          chmod 600 ~/.netrc
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: golangci/golangci-lint-action@v6
        with:
          args: --timeout=5m
