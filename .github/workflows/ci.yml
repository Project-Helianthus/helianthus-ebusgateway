name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  terminology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if git grep -nIwiE 'm[a]ster|s[l]ave'; then
            echo "Found legacy terminology."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/Project-Helianthus/*
      GONOSUMDB: github.com/Project-Helianthus/*
      GOPROXY: direct
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          TOKEN="${{ secrets.REPO_READ_TOKEN }}"
          if [ -z "$TOKEN" ]; then TOKEN="${{ github.token }}"; fi
          echo "machine github.com login x-access-token password ${TOKEN}" > ~/.netrc
          chmod 600 ~/.netrc
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: ./scripts/check_portal_assets.sh
      - run: go vet ./...
      - run: go build ./...

  test:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/Project-Helianthus/*
      GONOSUMDB: github.com/Project-Helianthus/*
      GOPROXY: direct
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          TOKEN="${{ secrets.REPO_READ_TOKEN }}"
          if [ -z "$TOKEN" ]; then TOKEN="${{ github.token }}"; fi
          echo "machine github.com login x-access-token password ${TOKEN}" > ~/.netrc
          chmod 600 ~/.netrc
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/Project-Helianthus/*
      GONOSUMDB: github.com/Project-Helianthus/*
      GOPROXY: direct
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          TOKEN="${{ secrets.REPO_READ_TOKEN }}"
          if [ -z "$TOKEN" ]; then TOKEN="${{ github.token }}"; fi
          echo "machine github.com login x-access-token password ${TOKEN}" > ~/.netrc
          chmod 600 ~/.netrc
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: golangci/golangci-lint-action@v6
