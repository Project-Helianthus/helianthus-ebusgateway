name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminology:
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - run: |
          if git grep -nIwiE 'm[a]ster|s[l]ave'; then
            echo "Found legacy terminology."
            exit 1
          fi
      - run: python3 scripts/source_selection_m4_gate.py

  build:
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # The persistent runner keeps its module directory; restoring the
          # setup-go cache over it only adds tar conflicts and minutes.
          # Hosted runners start empty and keep the cache.
          cache: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: ./scripts/check_portal_assets.sh
      - run: go vet ./...
      - run: go build ./...
      - name: Compile Linux 32-bit gateway
        run: |
          GOOS=linux GOARCH=386 go build -o /dev/null ./cmd/gateway
          GOOS=linux GOARCH=arm GOARM=7 go build -o /dev/null ./cmd/gateway
          GOOS=linux GOARCH=arm GOARM=6 go build -o /dev/null ./cmd/gateway

  test:
    # stays GitHub-hosted: race suite needs isolated CPU and the localhost-binding test is not runner-robust yet (CI migration val 3, see the follow-up issue linked in the PR body)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # The persistent runner keeps its module directory; restoring the
          # setup-go cache over it only adds tar conflicts and minutes.
          # Hosted runners start empty and keep the cache.
          cache: ${{ runner.environment == 'github-hosted' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # cmd/gateway runs at about 600 s under -race here, right at Go's 10-minute
      # default; 20 minutes keeps a margin inside the 45-minute job limit.
      - run: go test -race -count=1 -timeout 20m ./...
      - name: SemReg PV public integration
        run: GOWORK=off go test -race -count=1 ./internal/modbusadapter ./m2mgraphql ./mcp ./portal ./cmd/gateway -run 'TestPVPublication|TestAdapterPublishesOneSemRegPVProjection|TestSemanticPV|TestPortalPV|TestM2MGraphQLRuntime'
      - run: python3 scripts/passive_canary_verifier_test.py
      - run: python3 scripts/source_selection_m4_gate_test.py
      - run: python3 scripts/transport_gate_test.py
      - run: python3 scripts/passive_smoke_gate_test.py

  lint:
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
          # Compare the complete PR change set, including renames and deletions.
          # Hosted runners keep their existing shallow checkout.
          fetch-depth: ${{ runner.environment != 'github-hosted' && '0' || '1' }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # The persistent runner keeps its module directory; restoring the
          # setup-go cache over it only adds tar conflicts and minutes.
          # Hosted runners start empty and keep the cache.
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Test lint flake guard
        if: runner.environment != 'github-hosted'
        run: |
          rm -f "$RUNNER_TEMP/lint-findings.txt"
          bash scripts/lint_flake_guard_test.sh
      - uses: golangci/golangci-lint-action@v8
        id: lint
        with:
          # Keep in sync with GOLANGCI_LINT_EXPECTED_VERSION in scripts/ci_local.sh.
          version: v2.11.4
          # Shared restored caches can lose staticcheck's noreturn facts on
          # persistent runners. Hosted runners retain the action cache.
          skip-cache: ${{ runner.environment != 'github-hosted' }}
          # Allow cold runs ten minutes. Save self-hosted diagnostics without
          # source snippets or issue caps so the guard sees every finding.
          args: >-
            --timeout=10m
            ${{ runner.environment != 'github-hosted' && format('--output.text.path="{0}/lint-findings.txt" --output.text.colors=false --output.text.print-issued-lines=false --max-same-issues=0 --max-issues-per-linter=0', runner.temp) || '' }}
      - name: Identify self-hosted staticcheck runner flake
        if: ${{ failure() && steps.lint.outcome == 'failure' && runner.environment != 'github-hosted' }}
        env:
          LINT_LOG: ${{ runner.temp }}/lint-findings.txt
          CHANGED_FILES: ${{ runner.temp }}/lint-changed-files
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Keep every diagnostic visible even when flake classification rejects it.
          cat "$LINT_LOG"
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --no-renames --name-only -z "$PR_BASE...$PR_HEAD" > "$CHANGED_FILES"
            bash scripts/lint_flake_guard.sh "$LINT_LOG" pr "$CHANGED_FILES"
          else
            bash scripts/lint_flake_guard.sh "$LINT_LOG" push
          fi
          # The lint step remains failed: this warning requests triage/rerun,
          # never suppression, success, or an automatic retry loop.
