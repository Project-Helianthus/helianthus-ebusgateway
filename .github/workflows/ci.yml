name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminology:
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - run: |
          if git grep -nIwiE 'm[a]ster|s[l]ave'; then
            echo "Found legacy terminology."
            exit 1
          fi
      - run: python3 scripts/source_selection_m4_gate.py

  build:
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # The persistent runner keeps its module directory; restoring the
          # setup-go cache over it only adds tar conflicts and minutes.
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: ./scripts/check_portal_assets.sh
      - run: go vet ./...
      - run: go build ./...
      - name: Compile Linux 32-bit gateway
        run: |
          GOOS=linux GOARCH=386 go build -o /dev/null ./cmd/gateway
          GOOS=linux GOARCH=arm GOARM=7 go build -o /dev/null ./cmd/gateway
          GOOS=linux GOARCH=arm GOARM=6 go build -o /dev/null ./cmd/gateway

  test:
    # stays GitHub-hosted: race suite needs isolated CPU and the localhost-binding test is not runner-robust yet (CI migration val 3, see the follow-up issue linked in the PR body)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # The persistent runner keeps its module directory; restoring the
          # setup-go cache over it only adds tar conflicts and minutes.
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: go test -race -count=1 ./...
      - name: SemReg PV public integration
        run: GOWORK=off go test -race -count=1 ./internal/modbusadapter ./m2mgraphql ./mcp ./portal ./cmd/gateway -run 'TestPVPublication|TestAdapterPublishesOneSemRegPVProjection|TestSemanticPV|TestPortalPV|TestM2MGraphQLRuntime'
      - run: python3 scripts/passive_canary_verifier_test.py
      - run: python3 scripts/source_selection_m4_gate_test.py
      - run: python3 scripts/transport_gate_test.py
      - run: python3 scripts/passive_smoke_gate_test.py

  lint:
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          # The persistent runner keeps its module directory; restoring the
          # setup-go cache over it only adds tar conflicts and minutes.
          cache: false
      - uses: golangci/golangci-lint-action@v8
        with:
          # Keep in sync with GOLANGCI_LINT_EXPECTED_VERSION in scripts/ci_local.sh.
          version: v2.11.4
          args: --timeout=5m
