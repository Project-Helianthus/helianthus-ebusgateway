<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>INT-09 Portal contribution prototype</title>
    <link rel="stylesheet" href="int09.css">
  </head>
  <body>
    <a class="skip" href="#main">Skip to catalog</a>
    <header><h1>Helianthus Portal contribution v1</h1><p id="announcement" role="status" aria-live="polite">Loading fixture catalog.</p></header>
    <nav aria-label="Portal perspectives" id="perspectives"></nav>
    <main id="main" tabindex="-1">
      <section aria-labelledby="resources-title"><h2 id="resources-title">Installation and resources</h2><div id="resources"></div></section>
      <section aria-labelledby="catalog-title"><h2 id="catalog-title">Validated contributions</h2><div id="catalog"></div></section>
      <section aria-labelledby="states-title"><h2 id="states-title">Truthful state matrix</h2><div id="states"></div></section>
      <section aria-labelledby="actions-title"><h2 id="actions-title">Caller-scoped actions</h2><div id="actions"></div></section>
      <aside id="b503" aria-labelledby="b503-title"><h2 id="b503-title">B503 carry-forward</h2></aside>
    </main>
    <script type="module" src="int09.js"></script>
  </body>
</html>
