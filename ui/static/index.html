<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Helianthus Portal</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-graphql="{{.GraphQLPath}}">
    <div class="app">
      <header class="header">
        <div>
          <div class="title">Helianthus Portal</div>
          <div class="subtitle">Projection explorer</div>
        </div>
        <div class="header-actions">
          <span id="statusText" class="status-text"></span>
          <button id="refreshBtn" type="button">Refresh</button>
          <button id="pauseBtn" type="button">Pause</button>
        </div>
      </header>
      <div class="shell">
        <aside class="sidebar">
          <div class="section">
            <div class="section-title">Devices</div>
            <div id="deviceList" class="device-list"></div>
          </div>
          <label class="plane-label">
            Plane
            <select id="planeSelect"></select>
          </label>
        </aside>
        <main class="main">
          <section class="panel graph-panel">
            <div class="panel-header">
              <h2>Projection Graph</h2>
              <div id="graphMeta" class="graph-meta"></div>
            </div>
            <div id="graphContainer" class="graph"></div>
          </section>
          <section class="panel detail-panel">
            <h2>Node Details</h2>
            <div id="detailContainer" class="details"></div>
          </section>
        </main>
      </div>
    </div>
    <script src="./projection_helpers.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
